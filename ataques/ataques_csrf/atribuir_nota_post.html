<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UNiDIN</title>
</head>
<body>

    <h2>Material Extra</h2>

    <p>Material complementar da disciplina.</p>

    <form
        action="http://127.0.0.1:5000/disciplina/2/nota?student_id=4&assessment=1&value=5.0"
        method="POST">

        <!-- //127.0.0.1:5000/disciplina/ID_DA_DISCIPLINA/nota?student_id=ID_DO_ALUNO&assessment=1&value=NOTA_DE_TESTE 

        ID_DISCIPLINA: identificador da disciplina que pertence ao professor.

        ID_ALUNO: identificador do aluno matriculado na disciplina.

        ASSESSMENT: número da avaliação que receberá a nota.

        VALUE: valor da nota que será atribuída. -->

      
        <button type="submit">
            Acessar material extra
        </button>

    </form>

</body>
